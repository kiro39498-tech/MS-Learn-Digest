version: "3.9"

# ══════════════════════════════════════════════════════════════════════════════
# MS Learn Digest — Docker Compose (Local Development)
# ══════════════════════════════════════════════════════════════════════════════
# This file is for LOCAL development only.
# Production runs on Render (backend) + Vercel (frontend).
#
# All environment-specific values are supplied via the root .env file.
# No URL is hardcoded in this file.
#
# Usage:
#   docker compose up --build
#
# Required root .env values for Docker:
#   GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET, GROQ_API_KEY,
#   SMTP_EMAIL, SMTP_PASSWORD, JWT_SECRET_KEY
#
# The following are automatically overridden for Docker networking:
#   DATABASE_URL  → points at the 'db' service (not localhost)
#   VITE_API_URL  → points at the 'backend' service (not localhost or Render)
#   FRONTEND_URL  → http://localhost:5173 (same as local dev)
#   GOOGLE_REDIRECT_URI → http://localhost:8000/auth/google/callback
# ══════════════════════════════════════════════════════════════════════════════

services:
  # ──────────────────────────────────────────────
  # PostgreSQL Database
  # ──────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: mslearndigest
      POSTGRES_USER: mslearn
      POSTGRES_PASSWORD: mslearn_secret
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mslearn -d mslearndigest"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ──────────────────────────────────────────────
  # FastAPI Backend
  # ──────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Override DATABASE_URL to use the Docker 'db' service name, not localhost.
      - DATABASE_URL=postgresql://mslearn:mslearn_secret@db:5432/mslearndigest

      # Local OAuth callback — must match what's registered in Google Cloud Console.
      # Override here so the .env value (which may be production) is not used.
      - GOOGLE_REDIRECT_URI=http://localhost:8000/auth/google/callback

      # CORS — allow the local frontend origin.
      - FRONTEND_URL=http://localhost:5173
      - ALLOWED_ORIGINS=http://localhost:5173

      # Ensure scheduler/email magic links point at local frontend.
      - APP_ENV=development
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # ──────────────────────────────────────────────
  # React Frontend
  # ──────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      # Point the frontend at the local backend service (not Render).
      # 'backend' is the Docker Compose service name, resolved inside the network.
      # The Vite proxy rewrites /api/* → backend:8000 during dev.
      - VITE_API_URL=http://backend:8000

      # Google Client ID from root .env
      - VITE_GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev -- --host 0.0.0.0

volumes:
  postgres_data:
